name: Bootstrap Claude Science skills

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build minimal compatible source
        shell: bash
        run: |
          set -euo pipefail
          upstream="$(mktemp -d)"
          git clone --depth 1 https://github.com/Imbad0202/academic-research-skills.git "$upstream/source"

          cp -a "$upstream/source/academic-paper" .
          cp -a "$upstream/source/academic-paper-reviewer" .
          cp -a "$upstream/source/academic-pipeline" .
          cp -a "$upstream/source/deep-research" .
          cp -a "$upstream/source/.claude-plugin/plugin.json" .claude-plugin/plugin.json
          cp -a "$upstream/source/LICENSE" LICENSE

          sed -i 's/ -> / → /g' academic-pipeline/SKILL.md
          sed -i 's/"version": "3.20.0"/"version": "3.20.0-science.1"/' .claude-plugin/plugin.json

          rm -rf .github

          test "$(find academic-paper academic-paper-reviewer academic-pipeline deep-research -name SKILL.md -type f | wc -l)" -eq 4
          jq -e '.plugins[0].skills == ["./academic-paper","./academic-paper-reviewer","./academic-pipeline","./deep-research"]' .claude-plugin/marketplace.json
          jq -e '.version == "3.20.0-science.1"' .claude-plugin/plugin.json
          if grep -E '^description:.*[<>]' academic-paper/SKILL.md academic-paper-reviewer/SKILL.md academic-pipeline/SKILL.md deep-research/SKILL.md; then
            echo "Forbidden angle bracket remains in a skill description" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make all skills importable in Claude Science"
          git push origin main
